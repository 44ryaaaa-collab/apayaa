<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dear My Bini 💕</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <canvas id="starCanvas"></canvas>
  <div class="sparkles" id="sparkles"></div>

  <div class="content">
    <div class="moon">🌙</div>
    <div class="title">Dear My Bini</div>
    <div class="subtitle">✦ a message from the stars ✦</div>

    <div class="card">
      <div class="message">
        Di antara jutaan bintang di langit,<br>
        kamu adalah yang paling bersinar untukku. 🌟
      </div>
      <div class="big-message">Aku sayang kamu</div>
      <div class="message">
        Setiap malam aku melihat bintang-bintang ini,<br>
        aku selalu ingat betapa beruntungnya aku<br>
        memiliki kamu di hidupku. 💫
      </div>
      <div class="hearts">
        <span class="heart">💗</span>
        <span class="heart">💕</span>
        <span class="heart">💖</span>
      </div>
    </div>

    <button class="btn" onclick="sendLove()">Kirim Bintang Jatuh ✨</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
